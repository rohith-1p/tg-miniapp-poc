<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Café</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram injects --tg-theme-* so the app matches the user's light/dark theme */
  body { margin: 0; padding: 16px; font: 16px system-ui, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  .hint { color: var(--tg-theme-hint-color, #888); font-size: 14px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0;
          border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee); }
  .emoji { font-size: 32px; }
  .grow { flex: 1; }
  button { width: 36px; height: 36px; border: 0; border-radius: 18px; font-size: 20px;
           background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .qty { min-width: 20px; text-align: center; }
</style>
</head>
<body>
<h2 id="hello">Mini Café</h2>
<p class="hint" id="info"></p>
<div id="list"></div>
<script>
const tg = Telegram.WebApp;
tg.ready();
tg.expand();

const user = tg.initDataUnsafe.user;
if (user) document.getElementById("hello").textContent = `Hi, ${user.first_name} 👋`;
document.getElementById("info").textContent =
  `Platform: ${tg.platform} · Theme: ${tg.colorScheme} · v${tg.version}`;

const cart = {};
let products = [];

function render() {
  const list = document.getElementById("list");
  list.replaceChildren(...products.map(p => {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<span class="emoji">${p.emoji}</span>
      <span class="grow">${p.name}<br><span class="hint">₹${p.price}</span></span>
      <button aria-label="Remove ${p.name}">−</button>
      <span class="qty">${cart[p.id] || 0}</span>
      <button aria-label="Add ${p.name}">+</button>`;
    const [minus, plus] = row.querySelectorAll("button");
    minus.onclick = () => change(p.id, -1);
    plus.onclick = () => change(p.id, +1);
    return row;
  }));

  const total = products.reduce((s, p) => s + p.price * (cart[p.id] || 0), 0);
  if (total) tg.MainButton.setText(`Order · ₹${total}`).show();
  else tg.MainButton.hide();
}

function change(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  tg.HapticFeedback.impactOccurred("light");
  render();
}

// sendData hands the cart to the bot and closes the app (works when opened from a keyboard button)
tg.MainButton.onClick(() => {
  tg.HapticFeedback.notificationOccurred("success");
  tg.sendData(JSON.stringify(cart));
});

fetch("products.json").then(r => r.json()).then(p => { products = p; render(); });
</script>
</body>
</html>
