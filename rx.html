<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Prescription</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; background: #eef2f7; color: #111; }
  .rx { background: #fff; width: 340px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px #0002; }
  h2 { margin: 0; } .hint { color: #6b7280; font-size: 13px; } li { margin: 4px 0; }
  #qr { margin: 16px auto 0; width: 200px; }
</style>
</head>
<body>
<div class="rx">
  <h2>℞ e-Prescription</h2>
  <div class="hint">Dr. A. Sharma, MBBS · Demo Clinic, Bengaluru</div>
  <ol><li>Azithral 500, 1 tab daily × 5 days</li><li>Cetirizine 10mg, 1 tab at night</li></ol>
  <div id="qr"></div>
  <p class="hint" style="text-align:center">Scan with “Scan prescription” in the MediQuick Mini App</p>
</div>
<script>
new QRCode(document.getElementById("qr"), { text: "MEDIQUICK-RX:RX2026-0417:azithral,cetirizine", width: 200, height: 200 });
</script>
</body>
</html>
